# CI: affected lint/typecheck/test/build, every run measured by the nx-metrics plugin (nx.json).
# Optional repo settings (Settings → Secrets and variables → Actions):
#   vars.NX_CACHE_URL          remote cache (nx-remote-cache-custom), e.g. https://nx-cache.example.com
#   secrets.NX_CACHE_CI_TOKEN  write token, used on main only;  secrets.NX_CACHE_RO_TOKEN  read-only, PRs
#   vars.NX_METRICS_ENDPOINT   collector, e.g. https://nx-metrics.example.com/v1/runs;  secrets.NX_METRICS_TOKEN
# Without them CI still runs: local cache only, records only as artifact + job summary.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all:
        description: alle Projekte statt affected (run-many)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ vars.NX_CACHE_URL }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.NX_CACHE_CI_TOKEN || secrets.NX_CACHE_RO_TOKEN }}
  NX_METRICS_ENDPOINT: ${{ vars.NX_METRICS_ENDPOINT }}
  NX_METRICS_TOKEN: ${{ secrets.NX_METRICS_TOKEN }}
  NX_METRICS_LABEL: ci:${{ github.event_name }}
  NX_METRICS_CONSOLE: summary

jobs:
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # parallel generate-api-client tasks would each download the jar into the same dir → "Unable to access jarfile"
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/openapi-generator-cli
          key: openapi-generator-${{ hashFiles('openapitools.json') }}
      - name: OpenAPI generator jar (once, before nx)
        run: pnpm exec openapi-generator-cli version
      - name: Playwright Chromium (Vitest browser mode)
        run: pnpm exec playwright install --with-deps chromium
      - uses: nrwl/nx-set-shas@v5
        if: ${{ !inputs.all }}
      - name: nx affected
        if: ${{ !inputs.all }}
        run: pnpm exec nx affected -t lint typecheck test build --exclude=client-e2e
      - name: nx run-many (alle)
        if: ${{ inputs.all }}
        run: pnpm exec nx run-many -t lint typecheck test build --exclude=client-e2e
      - name: nx-metrics summary
        if: always()
        run: |
          if [ -f .nx/metrics/runs.jsonl ]; then
            pnpm -s nx-metrics report --group-by none >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nx-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .nx/metrics/runs.jsonl
          if-no-files-found: ignore
          retention-days: 90
