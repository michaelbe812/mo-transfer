apiVersion: 1
datasources:
  - name: nx-metrics
    uid: nx-metrics-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana
    secureJsonData:
      password: grafana
    jsonData:
      database: nxmetrics
      sslmode: disable
      postgresVersion: 1700
    isDefault: true
  - name: nx-cache
    uid: nx-cache-prom
    type: prometheus
    url: http://prometheus:9090
