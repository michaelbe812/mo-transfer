# Local stack: MinIO + Azurite (Azure Blob emulator) + one cache server per backend.
#   docker compose -f packages/nx-remote-cache-custom/docker/compose.yml up -d --build
# MinIO console: http://localhost:9001 (minioadmin/minioadmin)
# cache (MinIO): http://localhost:3100   cache (Azurite): http://localhost:3200
# tokens: ci `ci-token` (trusted/), developer `dev-token` (dev/ + reads trusted/), read-only `ro-token` (trusted/)
name: nx-remote-cache

services:
  minio:
    # MinIO no longer publishes images; pgsty builds the upstream source (drop-in, AGPLv3)
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10

  # bucket + retention per namespace: trusted/ (CI) 14 days, dev/ (developer machines) 3 days
  minio-init:
    image: pgsty/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/nx-cache &&
      echo '{\"Rules\":[{\"ID\":\"trusted\",\"Status\":\"Enabled\",\"Filter\":{\"Prefix\":\"trusted/\"},\"Expiration\":{\"Days\":14}},{\"ID\":\"dev\",\"Status\":\"Enabled\",\"Filter\":{\"Prefix\":\"dev/\"},\"Expiration\":{\"Days\":3}}]}' | mc ilm import local/nx-cache
      "

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --loose --skipApiVersionCheck
    ports: ['10000:10000']

  cache-minio:
    build: ..
    depends_on:
      minio-init: { condition: service_completed_successfully }
    environment:
      STORAGE_PROVIDER: minio
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: nx-cache
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      NX_CACHE_CI_TOKENS: ci-token
      NX_CACHE_DEV_TOKENS: dev-token
      NX_CACHE_READ_ONLY_TOKENS: ro-token
    ports: ['3100:3000']

  cache-azurite:
    build: ..
    depends_on: [azurite]
    restart: on-failure
    environment:
      STORAGE_PROVIDER: azure
      # well-known Azurite dev account
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      AZURE_STORAGE_CONTAINER: nx-cache
      STORAGE_CREATE_BUCKET: 'true'
      NX_CACHE_CI_TOKENS: ci-token
      NX_CACHE_DEV_TOKENS: dev-token
      NX_CACHE_READ_ONLY_TOKENS: ro-token
    ports: ['3200:3000']

volumes:
  minio-data:
