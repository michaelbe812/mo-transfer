# Single-host deployment (one machine in the LAN, e.g. a Mac mini): cache + MinIO + metrics stack.
# Not used from the repo directly: deploy.sh copies this file, prometheus.yml, evict.sh and both packages
# (src/nx-remote-cache-custom, src/nx-metrics-collector) to the host and runs `docker compose up -d --build` there.
#
# LAN:        cache :3100 · collector :4000 (/v1/runs) · grafana :3310
# host only:  minio :9000 (console :9001) · prometheus :9090
# limits:     every entry expires after 5 days (ILM) · evictor trims oldest entries above 90 GiB to 80 GiB · hard quota 100 GiB
# secrets:    .env next to this file (deploy.sh generates it once, see .env.example)
name: nx-cache

services:
  minio:
    image: pgsty/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # metrics only reachable inside the compose network (port 9000 is bound to localhost)
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes:
      - type: bind
        source: ${NX_CACHE_DATA_DIR:?set NX_CACHE_DATA_DIR in .env}
        target: /data
        # an unmounted external disk must not silently turn into a folder on the internal disk
        bind: { create_host_path: false }
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 20

  # bucket, retention (5 days for both namespaces) and hard quota
  minio-init:
    image: pgsty/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      RETENTION_DAYS: ${NX_CACHE_RETENTION_DAYS:-5}
      QUOTA_GIB: ${NX_CACHE_QUOTA_GIB:-100}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/nx-cache &&
      echo '{\"Rules\":[{\"ID\":\"trusted\",\"Status\":\"Enabled\",\"Filter\":{\"Prefix\":\"trusted/\"},\"Expiration\":{\"Days\":'$$RETENTION_DAYS'}},{\"ID\":\"dev\",\"Status\":\"Enabled\",\"Filter\":{\"Prefix\":\"dev/\"},\"Expiration\":{\"Days\":'$$RETENTION_DAYS'}}]}' | mc ilm import local/nx-cache &&
      mc quota set local/nx-cache --size $${QUOTA_GIB}GiB
      "

  # size cap below the quota: deletes the oldest entries once the bucket exceeds EVICT_HIGH_GIB
  evictor:
    image: pgsty/mc:latest
    restart: unless-stopped
    depends_on:
      minio-init: { condition: service_completed_successfully }
    entrypoint: ['/bin/bash', '/evict.sh']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      EVICT_HIGH_GIB: ${NX_CACHE_EVICT_HIGH_GIB:-90}
      EVICT_LOW_GIB: ${NX_CACHE_EVICT_LOW_GIB:-80}
      EVICT_INTERVAL_SECONDS: '600'
    volumes:
      - ./evict.sh:/evict.sh:ro

  cache:
    build: ./src/nx-remote-cache-custom
    restart: unless-stopped
    depends_on:
      minio-init: { condition: service_completed_successfully }
    environment:
      STORAGE_PROVIDER: minio
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: nx-cache
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      NX_CACHE_CI_TOKENS: ${NX_CACHE_CI_TOKENS}
      NX_CACHE_DEV_TOKENS: ${NX_CACHE_DEV_TOKENS}
      NX_CACHE_READ_ONLY_TOKENS: ${NX_CACHE_READ_ONLY_TOKENS}
      NX_CACHE_METRICS_TOKEN: ${NX_CACHE_METRICS_TOKEN}
    ports: ['3100:3000']

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nxmetrics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nxmetrics
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/nx-metrics-collector/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nxmetrics -d nxmetrics']
      interval: 3s
      retries: 20

  collector:
    build: ./src/nx-metrics-collector
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://nxmetrics:${POSTGRES_PASSWORD}@postgres:5432/nxmetrics
      COLLECTOR_TOKENS: ${COLLECTOR_TOKENS}
    ports: ['4000:4000']

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=90d']
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./secrets/metrics-token:/etc/prometheus/metrics-token:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:9090:9090']

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on: [postgres, prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/nx-metrics.json
    volumes:
      - ./src/nx-metrics-collector/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./src/nx-metrics-collector/docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ['3310:3000']

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
